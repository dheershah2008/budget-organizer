<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Log</title>
<style>
  :root {
    --bg: #eef1f5;
    --card: #ffffff;
    --ink: #14213d;
    --muted: #5f6b7d;
    --line: #d5dbe4;
    --accent: #1f7a6d;
    --accent-ink: #ffffff;
    --danger: #b3261e;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1623;
      --card: #182234;
      --ink: #e8edf5;
      --muted: #96a3b8;
      --line: #2a3750;
      --accent: #3fb8a5;
      --accent-ink: #0b1a17;
      --danger: #f2877f;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.4;
  }
  main { max-width: 440px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0; }
  h2 { font-size: 1.05rem; margin: 28px 0 10px; }
  .total { color: var(--muted); margin: 4px 0 20px; }
  .total strong { color: var(--ink); font-size: 1.1rem; }
  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
  }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input {
    width: 100%;
    font: inherit;
    font-size: 1.6rem;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    color: var(--ink);
  }
  .cats { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
  #customCat { font-size: 1rem; margin: -4px 0 14px; }
  .cats button {
    flex: 1 1 auto;
    min-height: 44px;
    padding: 0 14px;
    font: inherit;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
  }
  .cats button[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
  }
  .primary {
    width: 100%;
    min-height: 50px;
    font: inherit;
    font-weight: 600;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-ink);
  }
  .secondary {
    flex: 1 1 120px;
    min-height: 44px;
    font: inherit;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: transparent;
    color: var(--ink);
  }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #msg { min-height: 1.4em; margin: 10px 0 0; color: var(--muted); }
  #msg.error { color: var(--danger); }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  li .info { flex: 1; min-width: 0; }
  li .what { font-weight: 600; }
  li .when { color: var(--muted); font-size: 0.85rem; }
  li .del {
    min-width: 44px;
    min-height: 44px;
    border: 0;
    background: transparent;
    color: var(--danger);
    font: inherit;
  }
  .empty { color: var(--muted); padding: 8px 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .note { color: var(--muted); font-size: 0.85rem; margin-top: 12px; }
  .sync-status { color: var(--muted); margin: 0 0 8px; }
  .pending { color: var(--accent); font-weight: 600; font-size: 0.85rem; }
  details { margin-top: 20px; }
  summary { min-height: 44px; display: flex; align-items: center; font-weight: 600; cursor: pointer; }
  details input { font-size: 1rem; margin-bottom: 12px; }
</style>
</head>
<body>
<main>
  <h1>Expense log</h1>
  <p class="total">Today: <strong id="todayTotal">0</strong></p>

  <section class="panel">
    <label for="amount">Amount</label>
    <input id="amount" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
    <div class="cats" id="cats" role="group" aria-label="Category"></div>
    <input id="customCat" type="text" maxlength="30" placeholder="Type a category" aria-label="Custom category" autocomplete="off" hidden>
    <button class="primary" id="save">Save expense</button>
    <p id="msg" role="status"></p>
  </section>

  <h2>Recent entries</h2>
  <p class="sync-status" id="syncStatus"></p>
  <ul id="list"></ul>

  <div class="actions">
    <button class="secondary" id="syncBtn">Sync now</button>
    <button class="secondary" id="csv">Download CSV</button>
    <button class="secondary" id="copy">Copy for Sheets</button>
  </div>

  <details id="settings">
    <summary>Sheet sync settings</summary>
    <label for="sheetUrl">Web app link</label>
    <input id="sheetUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
    <label for="sheetSecret">Secret word</label>
    <input id="sheetSecret" type="text" placeholder="Same word as in your script" autocomplete="off">
    <button class="secondary" id="saveSync" style="width:100%">Save sync settings</button>
  </details>

  <p class="note">Entries are always saved on this device first, so the app works with no internet. They sync to your Sheet whenever a connection is available. Deleting an entry here does not remove it from the Sheet.</p>
</main>

<script>
  // ---- Settings you can edit ----
  const CATEGORIES = ['Food', 'Transport', 'Study', 'Shopping', 'Other'];
  const STORAGE_KEY = 'expenses_v1';

  // ---- Storage ----
  function loadEntries() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) {
      return [];
    }
  }
  function saveEntries(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  const SETTINGS_KEY = 'sync_settings_v1';
  function loadSettings() {
    try {
      return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {};
    } catch (e) {
      return {};
    }
  }

  // ---- Date formatting (uses the phone's own timezone) ----
  const dateFmt = new Intl.DateTimeFormat('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  const dayFmt = new Intl.DateTimeFormat('en-US', { weekday: 'long' });
  const timeFmt = new Intl.DateTimeFormat('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });

  function parts(ts) {
    const d = new Date(ts);
    return { date: dateFmt.format(d), day: dayFmt.format(d), time: timeFmt.format(d) };
  }

  // ---- UI state ----
  let selected = CATEGORIES[0];
  const $ = (id) => document.getElementById(id);

  function showMsg(text, isError) {
    const el = $('msg');
    el.textContent = text;
    el.className = isError ? 'error' : '';
  }

  // The text box appears only while "Other" is selected
  function updateCustomBox(focus) {
    const box = $('customCat');
    const show = selected === 'Other';
    box.hidden = !show;
    if (show && focus) box.focus();
  }

  function renderCategories() {
    const box = $('cats');
    box.textContent = '';
    CATEGORIES.forEach((name) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = name;
      b.setAttribute('aria-pressed', String(name === selected));
      b.addEventListener('click', () => {
        selected = name;
        renderCategories();
        updateCustomBox(true);
      });
      box.appendChild(b);
    });
  }

  function renderList() {
    const entries = loadEntries();
    const list = $('list');
    list.textContent = '';

    // Today's total
    const todayStr = new Date().toDateString();
    const total = entries
      .filter((e) => new Date(e.ts).toDateString() === todayStr)
      .reduce((sum, e) => sum + e.amount, 0);
    $('todayTotal').textContent = total.toLocaleString(undefined, { maximumFractionDigits: 2 });

    const cfg = loadSettings();
    const waiting = entries.filter((e) => !e.synced).length;
    $('syncStatus').textContent = !cfg.url
      ? 'Sheet sync is not set up yet.'
      : waiting === 0
        ? 'All entries are synced to your Sheet.'
        : waiting + ' waiting to sync.';

    if (entries.length === 0) {
      const p = document.createElement('li');
      p.className = 'empty';
      p.textContent = 'No expenses yet. Add your first one above.';
      list.appendChild(p);
      return;
    }

    entries.slice(-15).reverse().forEach((e) => {
      const p = parts(e.ts);
      const li = document.createElement('li');

      const info = document.createElement('div');
      info.className = 'info';
      const what = document.createElement('div');
      what.className = 'what';
      what.textContent = e.amount + ' · ' + e.category;
      if (cfg.url && !e.synced) {
        const tag = document.createElement('span');
        tag.className = 'pending';
        tag.textContent = '  (not synced)';
        what.appendChild(tag);
      }
      const when = document.createElement('div');
      when.className = 'when';
      when.textContent = p.day + ', ' + p.date + ', ' + p.time;
      info.append(what, when);

      const del = document.createElement('button');
      del.className = 'del';
      del.type = 'button';
      del.textContent = 'Delete';
      del.setAttribute('aria-label', 'Delete ' + e.amount + ' ' + e.category);
      del.addEventListener('click', () => {
        if (!confirm('Delete this entry?')) return;
        saveEntries(loadEntries().filter((x) => x.id !== e.id));
        renderList();
      });

      li.append(info, del);
      list.appendChild(li);
    });
  }

  // ---- Add an expense ----
  function addExpense() {
    const amount = Number($('amount').value);
    if (!amount || amount <= 0) {
      showMsg('Enter an amount greater than 0.', true);
      return;
    }
    let category = selected;
    if (selected === 'Other') {
      // Tidy spaces and drop leading = + - @ so a Sheet never treats the text as a formula
      category = $('customCat').value.trim().replace(/\s+/g, ' ').replace(/^[=+\-@]+/, '');
      if (!category) {
        showMsg('Type a category name.', true);
        $('customCat').focus();
        return;
      }
    }
    const now = Date.now();
    const entry = { id: now + '-' + Math.random().toString(36).slice(2, 7), ts: now, amount: amount, category: category, synced: false };
    try {
      const entries = loadEntries();
      entries.push(entry);
      saveEntries(entries);
    } catch (err) {
      showMsg('Could not save. Storage may be full or blocked in this browser.', true);
      return;
    }
    $('amount').value = '';
    $('customCat').value = '';
    showMsg('Saved ' + amount + ' under ' + category + '.', false);
    renderList();
    $('amount').focus();
    syncNow(true);
  }

  // ---- Export ----
  // Wraps a value in quotes when it contains a comma or quote, so CSV columns never shift
  function cell(value, separator) {
    const s = String(value).replace(/[\t\r\n]+/g, ' ');
    return separator === ',' && /[",]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function buildRows(separator) {
    const header = ['Date', 'Day', 'Time', 'Amount', 'Category'].join(separator);
    const rows = loadEntries().map((e) => {
      const p = parts(e.ts);
      return [p.date, p.day, p.time, e.amount, e.category].map((v) => cell(v, separator)).join(separator);
    });
    return [header].concat(rows).join('\n');
  }

  function downloadCsv() {
    if (loadEntries().length === 0) { showMsg('Nothing to export yet.', true); return; }
    const blob = new Blob([buildRows(',')], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = 'expenses-' + stamp + '.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showMsg('CSV downloaded. Open it in Google Sheets or Excel.', false);
  }

  function copyForSheets() {
    if (loadEntries().length === 0) { showMsg('Nothing to copy yet.', true); return; }
    const text = buildRows('\t'); // tab-separated pastes into separate cells
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      ta.remove();
      showMsg(ok ? 'Copied. Paste into a Sheet.' : 'Copy failed. Use Download CSV instead.', !ok);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text)
        .then(() => showMsg('Copied. Paste into a Sheet.', false))
        .catch(fallback);
    } else {
      fallback();
    }
  }

  // ---- Sync to Google Sheets ----
  let syncing = false;

  // quiet = true for automatic syncs (no error popups when offline)
  async function syncNow(quiet) {
    const cfg = loadSettings();
    if (!cfg.url) {
      if (!quiet) showMsg('Add your web app link under Sheet sync settings first.', true);
      return;
    }
    if (syncing) return;

    const pending = loadEntries().filter((e) => !e.synced);
    if (pending.length === 0) {
      if (!quiet) showMsg('Everything is already synced.', false);
      return;
    }
    if (!navigator.onLine) {
      if (!quiet) showMsg('No connection. Entries are saved here and will sync later.', true);
      return;
    }

    syncing = true;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 20000); // give up on a hanging connection
    try {
      const batch = pending.map((e) => {
        const p = parts(e.ts);
        return { id: e.id, date: p.date, day: p.day, time: p.time, amount: e.amount, category: e.category };
      });
      // No custom headers on purpose: this keeps it a "simple" request that Apps Script accepts.
      const res = await fetch(cfg.url, {
        method: 'POST',
        body: JSON.stringify({ secret: cfg.secret || '', entries: batch }),
        signal: ctrl.signal
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'The Sheet rejected the data');

      // Re-load before updating so entries added during the sync are not lost
      const done = new Set(data.saved);
      saveEntries(loadEntries().map((e) => (done.has(e.id) ? Object.assign({}, e, { synced: true }) : e)));
      if (!quiet) showMsg('Synced ' + batch.length + (batch.length === 1 ? ' entry' : ' entries') + ' to your Sheet.', false);
    } catch (err) {
      if (!quiet) showMsg('Sync failed: ' + err.message + '. Entries are still saved here.', true);
    } finally {
      clearTimeout(timer);
      syncing = false;
      renderList();
    }
  }

  function saveSyncSettings() {
    const url = $('sheetUrl').value.trim();
    const secret = $('sheetSecret').value.trim();
    if (url && !/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) {
      showMsg("That doesn't look like a web app link. It should start with https://script.google.com and end with /exec.", true);
      return;
    }
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify({ url: url, secret: secret }));
    } catch (e) {
      showMsg('Could not save the settings in this browser.', true);
      return;
    }
    showMsg('Sync settings saved.', false);
    renderList();
    syncNow(false);
  }

  // ---- Wire up ----
  $('save').addEventListener('click', addExpense);
  $('amount').addEventListener('keydown', (e) => { if (e.key === 'Enter') addExpense(); });
  $('csv').addEventListener('click', downloadCsv);
  $('copy').addEventListener('click', copyForSheets);
  $('syncBtn').addEventListener('click', () => syncNow(false));
  $('saveSync').addEventListener('click', saveSyncSettings);
  window.addEventListener('online', () => syncNow(true)); // sync as soon as signal returns

  const savedCfg = loadSettings();
  $('sheetUrl').value = savedCfg.url || '';
  $('sheetSecret').value = savedCfg.secret || '';

  renderCategories();
  updateCustomBox(false);
  renderList();
  syncNow(true); // try once when the app opens
</script>
</body>
</html>
